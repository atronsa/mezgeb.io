# Checks the site on every PR and push. Deploys are done by Cloudflare Pages,
# which is connected to this repo and builds `main` itself (see README).
name: site
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Makes scripts/sync-mezgeb.mjs fail on any broken link in the synced docs.
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `check` runs the sync, then type-checks; `build` validates every internal link.
      - run: pnpm check
      - run: pnpm --filter site build
